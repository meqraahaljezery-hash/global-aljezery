name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-36'
        accept-android-sdk-licenses: true

    # 1. إنشاء جميع الملفات الناقصة التي يطلبها AI Studio
    - name: Create Missing Files (Env, Keystore, Firebase)
      run: |
        # إنشاء ملفات البيئة
        touch .env
        touch .env.example
        
        # إنشاء ملفات التوقيع
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
        
        # إنشاء ملف Firebase وهمي
        mkdir -p app
        echo '{"project_info":{"project_number":"123456789","project_id":"dummy-project","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.aistudio.aljazari.maqraah"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json

    # 2. تجهيز Gradle وإنشاء الـ Wrapper الناقص
    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.11.1
        chmod +x ./gradlew

    # 3. البناء الفعلي
    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace

    # 4. رفع الملف
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk