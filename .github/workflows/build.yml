name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-36'
        accept-android-sdk-licenses: true

    # 1. إنشاء الملفات الناقصة (ملفات التوقيع والبيئة فقط)
    - name: Create Missing Files (Env, Keystore)
      run: |
        touch .env
        touch .env.example
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"

    # 2. تجهيز Gradle 9.3.1
    - name: Setup Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 9.3.1
        chmod +x ./gradlew

    # 3. البناء الفعلي
    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace

    # 4. رفع الملف
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk